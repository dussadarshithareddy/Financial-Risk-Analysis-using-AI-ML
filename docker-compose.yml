services:
  # Redis Cache Service (Optional)
  redis:
    image: redis:7-alpine
    container_name: fraud_detection_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud_detection_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fraud_detection_api
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be configured}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-fraud_detection_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured}
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./backup:/app/backup
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fraud_detection_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fraud_detection_frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fraud_detection_network
    restart: unless-stopped

  # Streamlit Dashboard Service (retained during the React transition)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud_detection_dashboard
    environment:
      API_BASE_URL: http://api:8000
      DEBUG_MODE: ${DEBUG:-false}
      SESSION_TIMEOUT_MINUTES: 15
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "${DASHBOARD_HOST_PORT:-8502}:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - fraud_detection_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local

networks:
  fraud_detection_network:
    driver: bridge
