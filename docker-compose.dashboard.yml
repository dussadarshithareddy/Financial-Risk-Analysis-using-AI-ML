version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be configured}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-fraud_detection_db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be configured}
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fraud-network
    restart: unless-stopped

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - SESSION_TIMEOUT_MINUTES=15
      - DEBUG_MODE=false
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./dashboard:/app/dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - fraud-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: fraud-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - dashboard
    networks:
      - fraud-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:

networks:
  fraud-network:
    driver: bridge

# Usage:
# 
# Start all services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f dashboard
#   docker-compose logs -f api
#
# Stop all services:
#   docker-compose down
#
# Remove volumes (clean):
#   docker-compose down -v
#
# Development (with hot reload):
#   docker-compose up
#
# Production (with Nginx):
#   docker-compose --profile production up -d
#
# Access services:
#   Dashboard: http://localhost:8501
#   API: http://localhost:8000
#   API Docs: http://localhost:8000/docs
#   pgAdmin: http://localhost:5050
